<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Finder · Swipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0f1b2d; --muted:#64748b; --line:#e7ebf1; --keep:#10b981; --drop:#f43f5e; --accent:#4f46e5; --accent2:#06b6d4; }
  * { box-sizing:border-box; min-width:0; }
  body { margin:0; font-family:Manrope, system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); min-height:100vh;
         display:flex; flex-direction:column; align-items:center; overflow-x:clip;
         background:radial-gradient(1200px 600px at 10% -10%, #c7d2fe 0%, transparent 60%),
                    radial-gradient(900px 500px at 110% 10%, #a5f3fc 0%, transparent 55%),
                    linear-gradient(180deg,#eef2ff 0%,#f8fafc 60%); }
  header { width:100%; max-width:460px; padding:22px 18px 10px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:20px; margin:0; font-weight:800; display:flex; align-items:center; gap:10px; }
  header h1 i { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--accent),var(--accent2));
                display:grid; place-items:center; color:#fff; font-style:normal; font-size:15px; box-shadow:0 6px 16px rgba(79,70,229,.35); }
  header .count { font-size:13px; color:var(--muted); font-weight:700; background:rgba(255,255,255,.7); padding:6px 10px; border-radius:999px; }
  .bar { width:calc(100% - 36px); max-width:424px; height:6px; background:rgba(255,255,255,.7); border-radius:999px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0; transition:width .35s; border-radius:999px; }
  .deck { position:relative; width:calc(100% - 36px); max-width:424px; height:540px; margin:22px 0 18px; }
  .card { position:absolute; inset:0; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.9);
          border-radius:26px; box-shadow:0 24px 60px -20px rgba(15,27,45,.35), 0 2px 6px rgba(15,27,45,.06);
          display:flex; flex-direction:column; overflow:hidden; touch-action:none; user-select:none; cursor:grab; will-change:transform; }
  .card:active { cursor:grabbing; }
  .card.behind { transform:scale(.94) translateY(16px); opacity:.65; filter:blur(.5px); pointer-events:none; }
  .top { padding:22px 22px 18px; color:#fff; position:relative; background:linear-gradient(135deg,var(--c1),var(--c2)); }
  .top::after { content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.12); }
  .head { display:flex; align-items:center; gap:12px; margin-bottom:14px; position:relative; z-index:1; }
  .logo { width:46px; height:46px; border-radius:14px; background:rgba(255,255,255,.95); color:var(--c1); display:grid; place-items:center;
          font-weight:800; font-size:18px; box-shadow:0 6px 14px rgba(0,0,0,.15); flex:none; }
  .company { font-size:15px; font-weight:800; margin:0; }
  .loc { font-size:12.5px; opacity:.9; margin:2px 0 0; }
  .title { font-size:22px; line-height:1.22; margin:0; font-weight:800; position:relative; z-index:1; text-wrap:balance; }
  .body { padding:18px 22px 20px; display:flex; flex-direction:column; flex:1; gap:16px; }
  .scorerow { display:flex; align-items:center; gap:14px; }
  .ring { width:74px; height:74px; flex:none; position:relative; }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring b { position:absolute; inset:0; display:grid; place-items:center; font-size:19px; font-weight:800; }
  .why { font-size:13px; color:var(--muted); line-height:1.45; }
  .why strong { display:block; color:var(--ink); font-size:14px; margin-bottom:2px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { font-size:12.5px; font-weight:700; padding:7px 11px; border-radius:999px; background:#f1f5f9; color:#334155; white-space:nowrap; }
  .chip.hi { background:#ecfdf5; color:#047857; }
  .link { margin-top:auto; font-size:13.5px; font-weight:800; color:var(--accent); text-decoration:none; display:inline-flex; gap:6px; align-items:center; }
  .stamp { position:absolute; top:26px; z-index:3; padding:6px 14px; border:3px solid; border-radius:12px; font-weight:800;
           font-size:22px; letter-spacing:2px; opacity:0; background:rgba(255,255,255,.9); }
  .stamp.keep { left:20px; color:var(--keep); border-color:var(--keep); transform:rotate(-14deg); }
  .stamp.drop { right:20px; color:var(--drop); border-color:var(--drop); transform:rotate(14deg); }
  .actions { display:flex; gap:26px; align-items:center; margin:2px 0 12px; }
  .actions button { width:66px; height:66px; border-radius:50%; border:0; background:#fff; font-size:26px; cursor:pointer;
                    box-shadow:0 12px 26px -8px rgba(15,27,45,.35); transition:transform .15s, box-shadow .15s; font-family:inherit; }
  .actions button:hover { transform:translateY(-2px) scale(1.05); }
  .actions button:active { transform:scale(.94); }
  .actions .drop { color:var(--drop); } .actions .keep { color:#fff; background:linear-gradient(135deg,#34d399,#059669); }
  .actions .undo { width:48px; height:48px; font-size:19px; color:var(--muted); }
  .hint { font-size:12.5px; color:var(--muted); margin-bottom:6px; text-align:center; padding:0 16px; }
  .done, .empty { position:absolute; inset:0; display:grid; place-content:center; text-align:center; padding:30px; color:var(--muted);
                  background:rgba(255,255,255,.85); border-radius:26px; box-shadow:0 24px 60px -20px rgba(15,27,45,.3); }
  .done .big { font-size:46px; margin-bottom:8px; }
  .done h2 { color:var(--ink); margin:0 0 6px; font-size:22px; }
  .tools { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:14px 0 30px; }
  .tools label, .tools button { font:inherit; font-size:13.5px; font-weight:700; padding:11px 16px; border-radius:12px; border:1px solid var(--line);
                                background:rgba(255,255,255,.85); cursor:pointer; color:var(--ink); }
  .tools .primary { background:linear-gradient(135deg,var(--accent),#6366f1); color:#fff; border:0; box-shadow:0 10px 22px -10px rgba(79,70,229,.7); }
  input[type=file] { display:none; }
  :focus-visible { outline:3px solid #a5b4fc; outline-offset:2px; }
  @media (max-height:740px) { .deck { height:480px; } }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header><h1><i>✦</i>Job Finder</h1><span class="count" id="count"></span></header>
<div class="bar"><i id="progress"></i></div>
<div class="deck" id="deck"></div>
<div class="actions" id="actions">
  <button class="drop" title="Discard (←)" onclick="decide('discard')">✕</button>
  <button class="undo" title="Undo (Backspace)" onclick="undo()">↺</button>
  <button class="keep" title="Keep (→)" onclick="decide('keep')">✓</button>
</div>
<div class="hint">Swipe right to keep, left to discard · keyboard ← → · Backspace to undo</div>
<div class="tools">
  <label>Load offers_scored.json<input type="file" id="file" accept=".json"></label>
  <button class="primary" onclick="exportDecisions()">Export decisions</button>
</div>

<div id="exportBox" hidden style="width:100%;max-width:408px;margin:0 16px 30px">
  <p class="hint">If the download is blocked, copy this into <code>decisions.json</code>:</p>
  <textarea readonly style="width:100%;height:140px;font:12px monospace;border:1px solid var(--line);border-radius:10px;padding:10px"></textarea>
  <div class="tools"><button id="copyBtn" onclick="copyExport()">Copy</button></div>
</div>
<script>
const DEMO = [
  {title:"ML Engineer intern - computer vision", company:"ExampleVision", location:"Lille", remote:"2 days/week", sector:"Industry 4.0",
   contract:"Internship 6 months", start:"2027-09", salary_junior:"40-44", score:88.2, decision:"match",
   justification:"88% (threshold 50%). Weakest criteria: remote=60%, salary=80%", url:"https://example.com/offer/1"},
  {title:"NLP Engineer intern - LLM agents", company:"Northwind AI", location:"Paris", remote:"hybrid", sector:"Software",
   contract:"Internship 6 months", start:"2027-09", salary_junior:"42-46", score:79.5, decision:"match",
   justification:"80% (threshold 50%). Weakest criteria: location=70%, remote=60%", url:"https://example.com/offer/4"},
  {title:"Deep learning intern - medical imaging", company:"HelioMed", location:"Basel", remote:"no", sector:"Healthcare",
   contract:"Internship 6 months", start:"2027-09", salary_junior:"55-65 (CHF)", score:71.0, decision:"match",
   justification:"71% (threshold 50%). Weakest criteria: remote=0%, location=70%", url:"https://example.com/offer/5"}
];
const KEY = "jobfinder.decisions";
let offers = [], idx = 0, history = [], decisions = {};
try { decisions = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { decisions = {}; }

const id = o => (o.company + "|" + o.title).toLowerCase();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function load(list) {
  offers = list.filter(o => o.decision === "match").sort((a, b) => b.score - a.score);
  idx = offers.findIndex(o => !decisions[id(o)]); if (idx < 0) idx = offers.length;
  history = []; render();
}

const PALETTE = [["#4f46e5","#7c3aed"],["#0891b2","#2563eb"],["#059669","#0d9488"],["#db2777","#9333ea"],["#ea580c","#e11d48"],["#0f766e","#4338ca"]];
function hue(t) { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
function initials(n) { return String(n || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(); }
function ring(score) {
  const r = 30, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, score));
  const col = v >= 80 ? "#10b981" : v >= 65 ? "#4f46e5" : "#f59e0b";
  return `<div class="ring"><svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="${r}" fill="none" stroke="#eef2f7" stroke-width="8"/>
    <circle cx="37" cy="37" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c * v / 100} ${c}"/></svg><b>${Math.round(v)}%</b></div>`;
}
function cardHTML(o, behind) {
  const [c1, c2] = hue(o.company || "");
  const chips = [
    o.remote && o.remote !== "no" ? `<span class="chip hi">🏠 ${esc(o.remote)}</span>` : "",
    o.contract ? `<span class="chip">📄 ${esc(o.contract)}</span>` : "",
    o.start ? `<span class="chip">📅 ${esc(o.start)}</span>` : "",
    o.salary_junior ? `<span class="chip">💶 ${esc(o.salary_junior)} k€</span>` : "",
    o.sector ? `<span class="chip">🏷️ ${esc(o.sector)}</span>` : ""].join("");
  return `<div class="card${behind ? " behind" : ""}" style="--c1:${c1};--c2:${c2}">
    <div class="stamp keep">KEEP</div><div class="stamp drop">NOPE</div>
    <div class="top">
      <div class="head"><div class="logo">${esc(initials(o.company))}</div>
        <div><p class="company">${esc(o.company)}</p><p class="loc">📍 ${esc(o.location || "-")}</p></div></div>
      <h2 class="title">${esc(o.title)}</h2>
    </div>
    <div class="body">
      <div class="scorerow">${ring(o.score)}<div class="why"><strong>Match score</strong>${esc(o.justification)}</div></div>
      <div class="chips">${chips}</div>
      ${o.url ? `<a class="link" href="${esc(o.url)}" target="_blank" rel="noopener">View the offer →</a>` : ""}
    </div>
  </div>`;
}

function render() {
  const deck = document.getElementById("deck");
  const kept = Object.values(decisions).filter(d => d === "keep").length;
  document.getElementById("count").textContent = offers.length ? `${Math.min(idx + 1, offers.length)} / ${offers.length} · ${kept} kept` : "";
  document.getElementById("progress").style.width = offers.length ? (idx / offers.length * 100) + "%" : "0";
  if (!offers.length) { deck.innerHTML = `<div class="empty">No offer above the threshold.</div>`; return; }
  if (idx >= offers.length) {
    deck.innerHTML = `<div class="done"><div class="big">🎉</div><h2>All offers reviewed</h2>${kept} kept. Export your decisions to update the Excel tracker.</div>`;
    return;
  }
  deck.innerHTML = (offers[idx + 1] ? cardHTML(offers[idx + 1], true) : "") + cardHTML(offers[idx], false);
  drag(deck.lastElementChild);
}

function drag(card) {
  let x0 = 0, dx = 0, down = false;
  const keep = card.querySelector(".stamp.keep"), drop = card.querySelector(".stamp.drop");
  card.addEventListener("pointerdown", e => { if (e.target.tagName === "A") return; down = true; x0 = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = "none"; });
  card.addEventListener("pointermove", e => {
    if (!down) return; dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    keep.style.opacity = Math.max(0, dx / 120); drop.style.opacity = Math.max(0, -dx / 120);
  });
  const end = () => {
    if (!down) return; down = false; card.style.transition = "transform .25s";
    if (Math.abs(dx) > 110) decide(dx > 0 ? "keep" : "discard", card);
    else { card.style.transform = ""; keep.style.opacity = drop.style.opacity = 0; }
    dx = 0;
  };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}

function decide(choice, card) {
  if (idx >= offers.length) return;
  card = card || document.getElementById("deck").lastElementChild;
  card.style.transition = "transform .3s, opacity .3s";
  card.style.transform = `translateX(${choice === "keep" ? 600 : -600}px) rotate(${choice === "keep" ? 25 : -25}deg)`;
  card.style.opacity = 0;
  const o = offers[idx]; decisions[id(o)] = choice; history.push(idx); idx++;
  try { localStorage.setItem(KEY, JSON.stringify(decisions)); } catch (e) {}
  setTimeout(render, 280);
}

function undo() {
  if (!history.length) return;
  idx = history.pop(); delete decisions[id(offers[idx])];
  try { localStorage.setItem(KEY, JSON.stringify(decisions)); } catch (e) {}
  render();
}

function exportDecisions() {
  const out = offers.map(o => ({company:o.company, title:o.title, url:o.url, decision:decisions[id(o)] || "pending"}));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], {type:"application/json"}));
  a.download = "decisions.json"; a.click();
  const box = document.getElementById("exportBox");
  box.querySelector("textarea").value = JSON.stringify(out, null, 2); box.hidden = false;
}
function copyExport() {
  const t = document.querySelector("#exportBox textarea");
  navigator.clipboard.writeText(t.value).then(() => document.getElementById("copyBtn").textContent = "Copied", () => t.select());
}

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => load(JSON.parse(t))).catch(() => alert("Invalid JSON file"));
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") decide("keep");
  else if (e.key === "ArrowLeft") decide("discard");
  else if (e.key === "Backspace") undo();
});
load(DEMO);
</script>
</body>
</html>
